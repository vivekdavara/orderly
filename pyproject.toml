[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orderly"
version = "0.1.0"
description = "An order-processing monolith split into event-driven services: RabbitMQ, a transactional outbox, idempotent consumers and a saga with compensations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vivek Davara" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "aio-pika>=10.2",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "pydantic>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "hypothesis>=6.170", "httpx>=0.28", "ruff==0.17.3", "mypy>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orderly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
